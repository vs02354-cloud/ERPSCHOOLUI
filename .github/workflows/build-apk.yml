name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install npm dependencies
      run: npm install

    - name: Build Angular App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execute Permission for Gradle
      run: chmod +x ./android/gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./android

    - name: Rename APK
      run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/SchoolERP-Mobile.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SchoolERP-Android-APK
        path: android/app/build/outputs/apk/debug/SchoolERP-Mobile.apk
        retention-days: 7

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: android/app/build/outputs/apk/debug/SchoolERP-Mobile.apk
        tag_name: v1.0.${{ github.run_number }}
        name: SchoolERP Mobile Release v1.0.${{ github.run_number }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
