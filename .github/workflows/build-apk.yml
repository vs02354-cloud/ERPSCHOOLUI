name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Run Build and Capture Logs
      run: |
        echo "Starting build..." > build-log.txt
        echo "Node Version:" >> build-log.txt
        node -v >> build-log.txt 2>&1
        echo "NPM Install:" >> build-log.txt
        npm install >> build-log.txt 2>&1 || echo "NPM Install Failed" >> build-log.txt
        echo "Angular Build:" >> build-log.txt
        npm run build >> build-log.txt 2>&1 || echo "Angular Build Failed" >> build-log.txt
        echo "Capacitor Sync:" >> build-log.txt
        npx cap sync >> build-log.txt 2>&1 || echo "Cap Sync Failed" >> build-log.txt
        echo "Gradle Build:" >> build-log.txt
        chmod +x ./android/gradlew >> build-log.txt 2>&1
        cd android && ./gradlew assembleDebug >> ../build-log.txt 2>&1 || echo "Gradle Build Failed" >> ../build-log.txt
        
    - name: Upload Debug Log
      uses: actions/upload-artifact@v4
      with:
        name: Build-Debug-Log
        path: build-log.txt
        retention-days: 1
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SchoolERP-Android-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
