<div class="min-h-screen flex items-center justify-center p-4 animate-fade-in">
  <div class="glass-card max-w-lg w-full p-8">
    <!-- Back to Home -->
    <a routerLink="/" class="absolute top-6 left-6 flex items-center text-slate-500 hover:text-indigo-600 transition-colors group">
      <div class="p-2 bg-white/50 rounded-full group-hover:bg-indigo-50 border border-slate-100 shadow-sm mr-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      </div>
      <span class="text-sm font-semibold hidden sm:block">Back to Home</span>
    </a>

    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">Create Account</h2>
      <p class="text-slate-500 mt-2 text-sm">Join the SchoolERP platform today.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1 ml-1">User Type</label>
        <select formControlName="userType" class="w-full glass-input">
          <option value="Teacher">Teacher</option>
          <option value="Parent">Parent</option>
          <option value="Admin">Admin</option>
          <option value="Principal">Principal</option>
          <option value="Operator">Operator</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1 ml-1">First Name</label>
          <input type="text" formControlName="firstName" class="w-full glass-input" placeholder="">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1 ml-1">Last Name</label>
          <input type="text" formControlName="lastName" class="w-full glass-input" placeholder="">
        </div>
      </div>

      <div *ngIf="registerForm.get('userType')?.value !== 'Parent'">
        <label class="block text-sm font-medium text-slate-700 mb-1 ml-1">Email Address</label>
        <input type="email" formControlName="email" class="w-full glass-input" placeholder="john.doe@example.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1 ml-1">Mobile Number</label>
        <input type="text" formControlName="mobileNumber" class="w-full glass-input" placeholder="10-digit mobile number">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1 ml-1">Password</label>
        <input type="password" formControlName="password" class="w-full glass-input" placeholder="Create a strong password">
      </div>



      <button type="submit" [disabled]="isSubmitting()" class="w-full glass-button flex justify-center items-center mt-6">
        <svg *ngIf="isSubmitting()" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        {{ isSubmitting() ? 'Creating account...' : 'Create Account' }}
      </button>

      <div *ngIf="errorMessage()" class="text-red-500 text-sm text-center mt-2">{{ errorMessage() }}</div>

    </form>

    <div class="mt-8 text-center text-sm text-slate-500">
      Already have an account? 
      <a routerLink="/login" class="font-semibold text-indigo-600 hover:text-indigo-500 transition-colors">Sign in here</a>
    </div>

  </div>
</div>
