<div class="space-y-6 max-w-4xl mx-auto py-8 px-4 animate-fade-in">
  <div>
    <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-700 to-purple-600 tracking-tight">Send Notification</h2>
    <p class="text-slate-500 text-sm font-medium mt-1">Directly message targeted groups of teachers or parents.</p>
  </div>

  <div class="glass-card p-6 md:p-8 rounded-3xl shadow-xl border border-white/50 bg-white/60">
    <div *ngIf="successMessage" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 font-medium text-sm flex items-center">
      <svg class="w-5 h-5 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 font-medium text-sm flex items-center">
      <svg class="w-5 h-5 mr-2 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {{ errorMessage }}
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- Left Column: Compose Message -->
      <div class="space-y-5">
        <h3 class="font-bold text-slate-800 text-lg border-b border-slate-200 pb-2">1. Compose Message</h3>
        
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">Notification Title <span class="text-red-500">*</span></label>
          <input type="text" [(ngModel)]="title" placeholder="e.g., Important Parent Meeting" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all shadow-sm font-medium text-sm">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">Message Content <span class="text-red-500">*</span></label>
          <textarea [(ngModel)]="message" rows="6" placeholder="Write your message here..." class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all shadow-sm font-medium text-sm resize-none"></textarea>
        </div>
      </div>

      <!-- Right Column: Select Recipients -->
      <div class="space-y-5 flex flex-col h-full">
        <h3 class="font-bold text-slate-800 text-lg border-b border-slate-200 pb-2">2. Select Recipients</h3>
        
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">Target Audience</label>
          <div class="relative">
            <select [(ngModel)]="targetRole" (change)="onRoleChange()" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all appearance-none shadow-sm font-medium text-sm">
              <option value="Teacher">Teachers</option>
              <option value="Parent">Parents</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
          </div>
        </div>

        <div class="flex-1 min-h-[250px] flex flex-col">
          <div class="flex justify-between items-center mb-2">
            <label class="block text-sm font-bold text-slate-700">Select Users <span class="text-indigo-600">({{ selectedUsers.size }} selected)</span></label>
            <div class="space-x-3 text-xs font-bold">
              <button (click)="selectAll()" class="text-indigo-600 hover:text-indigo-800">Select All</button>
              <button (click)="deselectAll()" class="text-slate-500 hover:text-slate-700">Clear</button>
            </div>
          </div>

          <!-- User List Box -->
          <div class="border border-slate-200 rounded-xl bg-white overflow-y-auto flex-1 p-2 shadow-inner custom-scrollbar max-h-64">
            <div *ngIf="users.length === 0" class="text-center py-8 text-slate-500 text-sm font-medium">
              No users found for this role.
            </div>
            <div *ngFor="let user of users" 
                 (click)="toggleUserSelection(user.id)"
                 class="flex items-center p-3 hover:bg-indigo-50 rounded-lg cursor-pointer transition-colors border-b border-slate-50 last:border-0"
                 [ngClass]="{'bg-indigo-50': selectedUsers.has(user.id)}">
              <div class="flex-shrink-0 w-5 h-5 border border-slate-300 rounded mr-3 flex items-center justify-center transition-all"
                   [ngClass]="selectedUsers.has(user.id) ? 'bg-indigo-600 border-indigo-600' : 'bg-white'">
                <svg *ngIf="selectedUsers.has(user.id)" class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
              </div>
              <div class="flex flex-col">
                <span class="text-sm font-bold text-slate-800">{{ user.firstName }} {{ user.lastName }}</span>
                <span class="text-[10px] text-slate-500 uppercase font-semibold">{{ user.userName }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Submit Area -->
    <div class="mt-8 pt-6 border-t border-slate-200 flex justify-end">
      <button (click)="sendNotification()" [disabled]="isSubmitting" class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center">
        <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <svg *ngIf="!isSubmitting" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
        <span *ngIf="!isSubmitting">Send Notification</span>
        <span *ngIf="isSubmitting">Sending...</span>
      </button>
    </div>

  </div>
</div>
