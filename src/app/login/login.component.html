<div class="min-h-screen flex items-center justify-center p-4">
  <div class="glass-card max-w-md w-full p-8 animate-slide-up relative">
    
    <!-- Back to Home Link -->
    <a routerLink="/" class="absolute top-4 left-4 text-indigo-600 hover:text-indigo-800 flex items-center gap-1 text-sm font-medium transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Home
    </a>

    <div class="text-center mb-10 mt-4">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500 bg-opacity-20 text-indigo-600 mb-4 shadow-inner">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21l9-5-9-5-9 5 9 5z"></path>
        </svg>
      </div>
      <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">School<span class="text-indigo-600">ERP</span></h2>
      <p class="text-slate-500 mt-2 text-sm">Welcome back! Please login to your account.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1 ml-1">Email Address</label>
        <input type="email" formControlName="email" class="w-full glass-input" placeholder="Enter your email">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1 ml-1">
          <label class="block text-sm font-medium text-slate-700">Password</label>
          <a href="#" class="text-xs font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Forgot Password?</a>
        </div>
        <input type="password" formControlName="password" class="w-full glass-input" placeholder="••••••••">
      </div>

      <div class="flex items-center ml-1">
        <input id="remember-me" formControlName="rememberMe" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded bg-white bg-opacity-50">
        <label for="remember-me" class="ml-2 block text-sm text-slate-600">
          Remember me
        </label>
      </div>

      <button type="submit" [disabled]="isSubmitting()" class="w-full glass-button flex justify-center items-center mt-4">
        <svg *ngIf="isSubmitting()" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        {{ isSubmitting() ? 'Signing in...' : 'Sign In' }}
      </button>

      <div *ngIf="errorMessage()" class="text-red-500 text-sm text-center mt-4">{{ errorMessage() }}</div>

    </form>

    <div class="mt-8 text-center text-sm text-slate-500">
      Don't have an account? 
      <a routerLink="/register" class="font-semibold text-indigo-600 hover:text-indigo-500 transition-colors">Register now</a>
    </div>

  </div>
</div>
