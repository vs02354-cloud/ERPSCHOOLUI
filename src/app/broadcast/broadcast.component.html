<div class="max-w-3xl mx-auto py-8">
  <div class="bg-white/70 backdrop-blur-md shadow-xl rounded-2xl p-8 border border-white/40 animate-fade-in">
    <div class="mb-8 border-b border-slate-200 pb-4">
      <h2 class="text-3xl font-bold text-slate-800 tracking-tight flex items-center">
        <svg class="w-8 h-8 mr-3 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
        {{ 'BROADCAST_TITLE' | translate }}
      </h2>
      <p class="text-sm text-slate-500 mt-2">{{ 'BROADCAST_DESC' | translate }}</p>
    </div>

    <div *ngIf="successMessage" class="mb-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl flex items-center shadow-sm">
      <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl flex items-center shadow-sm">
      <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {{ errorMessage }}
    </div>

    <form [formGroup]="broadcastForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">{{ 'BROADCAST_PLATFORM' | translate }}</label>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <label class="relative flex cursor-pointer rounded-xl border border-slate-200 bg-white p-4 shadow-sm hover:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-500 transition-all" [ngClass]="{'border-indigo-500 ring-2 ring-indigo-200 bg-indigo-50/50': broadcastForm.get('type')?.value === 'SMS'}">
            <input type="radio" formControlName="type" value="SMS" class="sr-only">
            <div class="flex items-center space-x-3">
              <div class="flex-shrink-0 text-indigo-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
              </div>
              <div>
                <p class="text-sm font-medium text-slate-900">{{ 'BROADCAST_FREE_SMS' | translate }}</p>
                <p class="text-xs text-slate-500">{{ 'BROADCAST_STD_TEXT' | translate }}</p>
              </div>
            </div>
          </label>

          <label class="relative flex cursor-pointer rounded-xl border border-slate-200 bg-white p-4 shadow-sm hover:border-green-400 focus-within:ring-2 focus-within:ring-green-500 transition-all" [ngClass]="{'border-green-500 ring-2 ring-green-200 bg-green-50/50': broadcastForm.get('type')?.value === 'WhatsApp'}">
            <input type="radio" formControlName="type" value="WhatsApp" class="sr-only">
            <div class="flex items-center space-x-3">
              <div class="flex-shrink-0 text-green-500">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
              </div>
              <div>
                <p class="text-sm font-medium text-slate-900">{{ 'BROADCAST_WHATSAPP' | translate }}</p>
                <p class="text-xs text-slate-500">{{ 'BROADCAST_RICH_MEDIA' | translate }}</p>
              </div>
            </div>
          </label>

          <label class="relative flex cursor-pointer rounded-xl border border-slate-200 bg-white p-4 shadow-sm hover:border-blue-400 focus-within:ring-2 focus-within:ring-blue-500 transition-all" [ngClass]="{'border-blue-500 ring-2 ring-blue-200 bg-blue-50/50': broadcastForm.get('type')?.value === 'Email'}">
            <input type="radio" formControlName="type" value="Email" class="sr-only">
            <div class="flex items-center space-x-3">
              <div class="flex-shrink-0 text-blue-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
              </div>
              <div>
                <p class="text-sm font-medium text-slate-900">Email</p>
                <p class="text-xs text-slate-500">Standard email delivery</p>
              </div>
            </div>
          </label>
        </div>
      </div>

      <div class="pt-2">
        <label class="block text-sm font-semibold text-slate-700 mb-2">{{ 'BROADCAST_AUDIENCE' | translate }}</label>
        <div class="flex items-center space-x-6 mb-4">
          <label class="inline-flex items-center cursor-pointer">
            <input type="radio" formControlName="targetAudience" value="All" class="form-radio h-5 w-5 text-indigo-600 transition duration-150 ease-in-out border-gray-300 focus:ring-indigo-500">
            <span class="ml-2 text-gray-700 font-medium">{{ 'BROADCAST_ALL_STUDENTS' | translate }}</span>
          </label>
          <label class="inline-flex items-center cursor-pointer">
            <input type="radio" formControlName="targetAudience" value="SpecificClass" class="form-radio h-5 w-5 text-indigo-600 transition duration-150 ease-in-out border-gray-300 focus:ring-indigo-500">
            <span class="ml-2 text-gray-700 font-medium">{{ 'BROADCAST_SPECIFIC_CLASS' | translate }}</span>
          </label>
        </div>

        <div *ngIf="broadcastForm.get('targetAudience')?.value === 'SpecificClass'" class="mb-4 animate-fade-in">
          <label for="targetClass" class="block text-sm font-semibold text-slate-700 mb-2">{{ 'BROADCAST_SELECT_CLASS' | translate }}</label>
          <select id="targetClass" formControlName="targetClass" class="glass-input w-full md:w-1/2 p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            <option value="">{{ 'BROADCAST_CHOOSE_CLASS' | translate }}</option>
            <option *ngFor="let cls of classes" [value]="cls">Class {{ cls }}</option>
          </select>
          <div *ngIf="broadcastForm.get('targetClass')?.touched && broadcastForm.get('targetClass')?.invalid" class="mt-2 text-xs text-red-500">
            <span *ngIf="broadcastForm.get('targetClass')?.errors?.['required']">Class is required when targeting a specific class.</span>
          </div>
        </div>
      </div>

      <div>
        <label for="message" class="block text-sm font-semibold text-slate-700 mb-2">{{ 'BROADCAST_MSG_CONTENT' | translate }}</label>
        <textarea id="message" formControlName="message" rows="5" class="glass-input w-full p-4 resize-none transition-shadow focus:ring-2 focus:ring-indigo-500" [placeholder]="'BROADCAST_MSG_PLACEHOLDER' | translate"></textarea>
        <div *ngIf="broadcastForm.get('message')?.touched && broadcastForm.get('message')?.invalid" class="mt-2 text-xs text-red-500">
          <span *ngIf="broadcastForm.get('message')?.errors?.['required']">Message is required.</span>
          <span *ngIf="broadcastForm.get('message')?.errors?.['minlength']">Message must be at least 5 characters long.</span>
        </div>
        <p class="text-xs text-slate-400 mt-2 text-right">{{ 'BROADCAST_NUMBER_NOTE' | translate }}</p>
      </div>

      <div class="pt-4 flex justify-end">
        <button type="submit" [disabled]="isSubmitting" class="glass-button w-full sm:w-auto px-8 py-3 text-base flex justify-center items-center group relative overflow-hidden disabled:opacity-70">
          <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
          <span class="relative flex items-center">
            <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <svg *ngIf="!isSubmitting" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            {{ isSubmitting ? ('BROADCAST_SENDING' | translate) : ('BROADCAST_SEND_BTN' | translate) }}
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
