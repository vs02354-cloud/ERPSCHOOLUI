<div class="max-w-4xl mx-auto px-4 py-8 animate-fade-in">
  
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-800">{{ 'APPLY_TC_TITLE' | translate }}</h1>
    <p class="text-slate-500 mt-2">Submit a request for a Transfer Certificate. This will be reviewed by the administration.</p>
  </div>

  <div *ngIf="successMessage" class="mb-6 p-4 bg-green-50 text-green-700 border border-green-200 rounded-xl flex items-center shadow-sm">
    <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 text-red-700 border border-red-200 rounded-xl flex items-center shadow-sm">
    <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    {{ errorMessage }}
  </div>

  <div class="glass-card p-6 md:p-8">
    <form (ngSubmit)="applyTC()" #tcForm="ngForm" class="space-y-6">
      
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Select Student *</label>
        <select [(ngModel)]="newTc.studentId" name="studentId" required class="glass-input w-full p-3 rounded-xl focus:ring-2 focus:ring-indigo-500">
          <option value="" disabled selected>-- Select a Student --</option>
          <option *ngFor="let s of availableStudents" [value]="s.id">
            {{s.firstName}} {{s.lastName}} ({{s.admissionNumber}}) - Class {{s.currentClass}}
          </option>
        </select>
        <p *ngIf="availableStudents.length === 0" class="text-xs text-slate-500 mt-1">Loading students...</p>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Reason for Leaving *</label>
        <textarea [(ngModel)]="newTc.reasonForLeaving" name="reasonForLeaving" required rows="4" 
                  class="glass-input w-full p-4 rounded-xl focus:ring-2 focus:ring-indigo-500"
                  placeholder="Please provide a detailed reason for requesting the transfer certificate..."></textarea>
      </div>

      <div class="pt-4 border-t border-slate-200 flex justify-end">
        <button type="submit" [disabled]="!tcForm.form.valid || isSubmitting" 
                class="glass-button w-full md:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center">
          <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          {{ isSubmitting ? 'Submitting Application...' : 'Submit Application' }}
        </button>
      </div>
    </form>
  </div>
</div>
